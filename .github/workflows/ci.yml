name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  typecheck:
    name: Typecheck
    uses: ./.github/workflows/typecheck.yml

  build:
    name: Build
    needs: [lint, typecheck]
    uses: ./.github/workflows/build.yml
