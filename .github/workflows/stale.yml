name: Stale

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Stale bot
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,priority: critical,blocked,in progress
          exempt-pr-labels: security,priority: critical,blocked,in progress
          stale-issue-message: >
            This issue has been marked as stale because it has been open for 60 days
            with no activity. It will be closed in 14 days if there is no further update.
            Comment to keep it open.
          stale-pr-message: >
            This pull request has been marked as stale because it has been open for 45 days
            with no activity. It will be closed in 14 days if there is no further update.
          close-issue-message: >
            Closing this issue due to inactivity. Please reopen or file a new issue if
            this is still relevant.
          close-pr-message: >
            Closing this pull request due to inactivity. Feel free to reopen when you
            are ready to continue.
          operations-per-run: 50
