name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://maintainerai:maintainerai@localhost:5432/maintainerai?schema=public
          NEXT_PUBLIC_APP_URL: http://localhost:3000
