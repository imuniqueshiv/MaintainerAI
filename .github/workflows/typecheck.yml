name: Typecheck

on:
  workflow_call:
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://maintainerai:maintainerai@localhost:5432/maintainerai?schema=public
          SKIP_ENV_VALIDATION: "1"

      - name: Run typecheck
        run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgresql://maintainerai:maintainerai@localhost:5432/maintainerai?schema=public
