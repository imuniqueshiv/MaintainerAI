name: Spellcheck

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - ".github/workflows/spellcheck.yml"
  pull_request:
    paths:
      - "**.md"
  workflow_dispatch:

jobs:
  spellcheck:
    name: Codespell
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run codespell
        uses: codespell-project/actions-codespell@v2
        with:
          skip: "*.png,*.jpg,*.jpeg,*.gif,*.svg,*.ico,pnpm-lock.yaml,package-lock.json,node_modules,.next,dist,coverage"
          ignore_words_list: crate,nam
          check_filenames: true
          check_hidden: false
