name: Question
description: Ask a question about using or contributing to MaintainerAI
title: "[Question]: "
labels: ["question", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended discussion, prefer [GitHub Discussions (Q&A)](https://github.com/imuniqueshiv/MaintainerAI/discussions/new?category=q-a).
        Use this form when you need a tracked answer tied to the repository.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What have you already tried? Links to docs or issues help.
    validations:
      required: false
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation / setup
        - Configuration
        - GitHub App
        - AI providers
        - Docker / self-hosting
        - Contributing
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the FAQ and docs first
          required: true
        - label: This is not a security report
          required: true
