name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation", "needs triage"]
body:
  - type: dropdown
    id: doc_type
    attributes:
      label: Documentation type
      options:
        - README
        - /docs guide
        - Inline code comments
        - API / configuration reference
        - Contribution / governance docs
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: File path or URL of the documentation.
      placeholder: docs/installation.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
      description: Describe the gap or inaccuracy.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: How should it be improved?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked that the latest docs on `main` still have this issue
          required: true
