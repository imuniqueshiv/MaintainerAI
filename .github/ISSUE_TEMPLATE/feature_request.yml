name: Feature Request
description: Propose a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Share the problem you are solving. Strong proposals explain motivation before implementation details.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve for maintainers or contributors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should MaintainerAI behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / UI
        - Backend / API
        - AI / Copilot
        - Automation
        - GitHub App
        - Documentation
        - DX / Tooling
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Suggested priority
      options:
        - Nice to have
        - Should have
        - Must have
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, links, or related issues.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched issues and discussions for similar requests
          required: true
        - label: I am willing to help implement this (optional)
          required: false
