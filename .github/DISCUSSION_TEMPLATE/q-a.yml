title: "[Q&A]: "
body:
  - type: markdown
    attributes:
      value: |
        Ask the community for help. Check `/docs` and existing discussions first.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - Configuration
        - GitHub App
        - AI providers
        - Docker / self-hosting
        - Contributing
        - Other
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, docs pages, and error messages (secrets redacted).
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Node:
        pnpm:
        Deploy method:
    validations:
      required: false
