# MaintainerAI GitHub labels
# Sync with: gh label sync --file .github/labels.yml
# Or use the labels-sync workflow when enabled.

- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: security
  color: "b60205"
  description: Security related

- name: performance
  color: "f9d0c4"
  description: Performance improvements or regressions

- name: frontend
  color: "61dafb"
  description: Frontend / UI related

- name: backend
  color: "0e8a16"
  description: Backend / API related

- name: ui
  color: "c5def5"
  description: User interface

- name: ux
  color: "d4c5f9"
  description: User experience

- name: api
  color: "5319e7"
  description: API surface

- name: ai
  color: "fbca04"
  description: AI / copilot related

- name: automation
  color: "1d76db"
  description: Automation rules and workflows

- name: configuration
  color: "e4e669"
  description: Configuration and environment setup

- name: regression
  color: "e99695"
  description: Regression from previous behavior

- name: question
  color: "d876e3"
  description: Further information is requested

- name: priority: critical
  color: "b60205"
  description: Highest priority

- name: priority: high
  color: "d93f0b"
  description: High priority

- name: priority: medium
  color: "fbca04"
  description: Medium priority

- name: priority: low
  color: "0e8a16"
  description: Low priority

- name: blocked
  color: "000000"
  description: Blocked by another issue or external dependency

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists

- name: invalid
  color: "e4e669"
  description: This doesn't seem right

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

- name: needs triage
  color: "ededed"
  description: Needs initial triage from maintainers

- name: needs review
  color: "fbca04"
  description: Awaiting review

- name: in progress
  color: "1d76db"
  description: Actively being worked on

- name: ready
  color: "0e8a16"
  description: Ready to be worked on or merged

- name: dependencies
  color: "0366d6"
  description: Pull requests that update a dependency file

- name: ci
  color: "000000"
  description: Continuous integration

- name: breaking change
  color: "b60205"
  description: Introduces a breaking change

- name: stale
  color: "ffffff"
  description: Inactive issue or pull request
