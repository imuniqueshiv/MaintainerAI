services:
  maintainerai:
    build:
      context: .
      dockerfile: Dockerfile
    image: maintainerai:local
    container_name: maintainerai
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  maintainerai-dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm install && pnpm dev --hostname 0.0.0.0"
    volumes:
      - .:/app
      - maintainerai_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  maintainerai_node_modules:
